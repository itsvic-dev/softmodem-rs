[workspace]
resolver = "3"
members = ["softmodem", "softmodem-dsp", "softmodem-terminal", "softmodem-transport"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
softmodem-dsp = { path = "softmodem-dsp" }
softmodem-terminal = { path = "softmodem-terminal" }
softmodem-transport = { path = "softmodem-transport" }

anyhow = "1"
bytes = "1"
clap = { version = "4", features = ["derive"] }
ezk-rtp = "0.2"
fastrand = "2"
hound = "3"
rustix = { version = "1", features = ["fs", "pty", "termios"] }
tokio = { version = "1", features = ["io-std", "io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = "0.3"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
