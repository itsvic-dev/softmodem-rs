[workspace]
resolver = "3"
members = ["softmodem", "softmodem-dsp", "softmodem-interop", "softmodem-link", "softmodem-panel", "softmodem-slmodem", "softmodem-terminal", "softmodem-transport"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"

[workspace.dependencies]
softmodem = { path = "softmodem" }
softmodem-dsp = { path = "softmodem-dsp" }
softmodem-link = { path = "softmodem-link" }
softmodem-panel = { path = "softmodem-panel" }
softmodem-terminal = { path = "softmodem-terminal" }
softmodem-transport = { path = "softmodem-transport" }

anyhow = "1"
async-trait = "0.1"
bytes = "1"
bytesstr = "1"
clap = { version = "4", features = ["derive"] }
cpal = "0.18"
ezk-rtp = "0.2"
ezk-sdp-types = "0.6"
ezk-sip-auth = "0.5"
ezk-sip-core = "0.9"
ezk-sip-types = "0.6"
ezk-sip-ua = { version = "0.9", default-features = false }
fastrand = "2"
hound = "3"
libc = "0.2"
rustix = { version = "1", features = ["fs", "pty", "termios"] }
tokio = { version = "1", features = ["io-std", "io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

gpui = { git = "https://github.com/zed-industries/zed", tag = "v1.22.0", default-features = false }
gpui_platform = { git = "https://github.com/zed-industries/zed", tag = "v1.22.0", features = ["font-kit", "runtime_shaders"] }

[patch.crates-io]
# As Zed's workspace has it, which gpui needs.
async-task = { git = "https://github.com/smol-rs/async-task.git", rev = "b4486cd71e4e94fbda54ce6302444de14f4d190e" }
# Until upstream retries an INVITE challenged with 407.
ezk-internal = { git = "https://github.com/itsvic-dev/ezk", rev = "36b10d90b7890fa7a18f248521a5b4e2a9a9f7c2" }
ezk-sdp-types = { git = "https://github.com/itsvic-dev/ezk", rev = "36b10d90b7890fa7a18f248521a5b4e2a9a9f7c2" }
ezk-sip-auth = { git = "https://github.com/itsvic-dev/ezk", rev = "36b10d90b7890fa7a18f248521a5b4e2a9a9f7c2" }
ezk-sip-core = { git = "https://github.com/itsvic-dev/ezk", rev = "36b10d90b7890fa7a18f248521a5b4e2a9a9f7c2" }
ezk-sip-types = { git = "https://github.com/itsvic-dev/ezk", rev = "36b10d90b7890fa7a18f248521a5b4e2a9a9f7c2" }
ezk-sip-ua = { git = "https://github.com/itsvic-dev/ezk", rev = "36b10d90b7890fa7a18f248521a5b4e2a9a9f7c2" }
ezk-stun = { git = "https://github.com/itsvic-dev/ezk", rev = "36b10d90b7890fa7a18f248521a5b4e2a9a9f7c2" }
ezk-stun-types = { git = "https://github.com/itsvic-dev/ezk", rev = "36b10d90b7890fa7a18f248521a5b4e2a9a9f7c2" }

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
