[workspace]
resolver = "3"
members = ["softmodem", "softmodem-dsp", "softmodem-interop", "softmodem-link", "softmodem-slmodem", "softmodem-terminal", "softmodem-transport"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"

[workspace.dependencies]
softmodem = { path = "softmodem" }
softmodem-dsp = { path = "softmodem-dsp" }
softmodem-link = { path = "softmodem-link" }
softmodem-terminal = { path = "softmodem-terminal" }
softmodem-transport = { path = "softmodem-transport" }

anyhow = "1"
async-trait = "0.1"
bytes = "1"
bytesstr = "1"
clap = { version = "4", features = ["derive"] }
cpal = "0.18"
ezk-rtp = "0.2"
ezk-sdp-types = "0.6"
ezk-sip-auth = "0.5"
ezk-sip-core = "0.9"
ezk-sip-types = "0.6"
ezk-sip-ua = { version = "0.9", default-features = false }
fastrand = "2"
hound = "3"
rustix = { version = "1", features = ["fs", "pty", "termios"] }
tokio = { version = "1", features = ["io-std", "io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
